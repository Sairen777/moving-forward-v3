name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: master
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture release id
        id: version
        run: echo "release=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Upload to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: public

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy single retained release
        env:
          DEPLOY_ROOT: /var/www/movingforward.dev
          SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -euo pipefail

          release="${RELEASE}"
          remote_release="${DEPLOY_ROOT}/releases/${release}"

          ssh -i ~/.ssh/deploy_key -p 22 "${SSH_TARGET}" "mkdir -p '${remote_release}'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            public/ \
            "${SSH_TARGET}:${remote_release}/"
          ssh -i ~/.ssh/deploy_key -p 22 "${SSH_TARGET}" \
            "ln -sfn '${remote_release}' '${DEPLOY_ROOT}/next' && \
             mv -Tf '${DEPLOY_ROOT}/next' '${DEPLOY_ROOT}/current' && \
             find '${DEPLOY_ROOT}/releases' -mindepth 1 -maxdepth 1 -type d ! -name '${release}' -exec rm -rf -- {} +"
